<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f8f4" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Foodlog" />
    <meta name="description" content="Plan your day of eating." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/css/app.css" />
    <title>Foodlog</title>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <nav class="nav" aria-label="Main">
        <a class="nav-brand" href="#/day">
          <span class="nav-brand-mark" aria-hidden="true"></span>
          Foodlog
        </a>
        <a class="nav-link" href="#/day" data-nav="day">
          <span class="nav-icon" data-icon="sun" aria-hidden="true"></span>
          <span>Day</span>
        </a>
        <a class="nav-link" href="#/meals" data-nav="meals">
          <span class="nav-icon" data-icon="bowl" aria-hidden="true"></span>
          <span>Meals</span>
        </a>
        <a class="nav-link" href="#/foods" data-nav="foods">
          <span class="nav-icon" data-icon="leaf" aria-hidden="true"></span>
          <span>Foods</span>
        </a>
        <a class="nav-link" href="#/settings" data-nav="settings">
          <span class="nav-icon" data-icon="sliders" aria-hidden="true"></span>
          <span>Settings</span>
        </a>
      </nav>
      <main id="view" class="view" tabindex="-1"></main>
    </div>
    <div id="toasts" class="toasts" role="status" aria-live="polite"></div>
    <noscript>Foodlog needs JavaScript to run.</noscript>
  </body>
</html>
