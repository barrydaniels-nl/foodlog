services:
  app:
    build:
      context: .
      target: prod
    image: foodlog:latest
    ports:
      # Localhost only: Tailscale Serve is the way in, so the home LAN can't reach it.
      # Set FOODLOG_PORT (e.g. in .env) when 8080 is taken on the host.
      - "127.0.0.1:${FOODLOG_PORT:-8080}:8080"
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - foodlog-data:/data
    restart: unless-stopped

  test:
    profiles: [test]
    build:
      context: .
      target: dev
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  foodlog-data:
