services:
  app:
    build:
      context: .
      target: prod
    image: foodlog:latest
    ports:
      # Localhost only: Tailscale Serve is the way in, so the home LAN can't reach it.
      # Set FOODLOG_PORT (e.g. in .env) when 8080 is taken on the host.
      - "127.0.0.1:${FOODLOG_PORT:-8080}:8080"
    environment:
      TZ: Europe/Amsterdam
      # Day analysis (AI): set these in .env; without a key the feature is off.
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      # Password screen: set these in .env; without APP_PASSWORD the app is open.
      APP_PASSWORD: ${APP_PASSWORD:-}
      DIET_TOKEN: ${DIET_TOKEN:-}
    volumes:
      - foodlog-data:/data
    restart: unless-stopped

  test:
    profiles: [test]
    build:
      context: .
      target: dev
    environment:
      TZ: Europe/Amsterdam
    volumes:
      - .:/app
      - /app/node_modules

volumes:
  foodlog-data:
